# Fixed entries for the /writing/ page, keyed by the section they appear in.
#
# These live here rather than in _posts because they are finished and will not
# change, and because back-dated stubs would show up as new items in the feed.
# Living writing (notes and essays) goes in _posts instead.
#
# Each entry takes: title, url, and optionally meta and links. They render
# through the same include as posts, so the formatting matches. Use `links` for
# the same piece published elsewhere, which sits inline on the byline. A
# description field is supported but only the notes display one.

# Ongoing series of notes, each read in order and each with its own page. One
# entry per series rather than per note, so this section stays a fixed length as
# the series grow. `posts_kind` names the `kind:` that a series' posts carry, and
# the byline (how many, how recent) is computed from them so it cannot drift.
series:
  - title: Notes on Power
    url: /power/
    posts_kind: note

  - title: How to Search on Encrypted Data
    url: /how-to-search-on-encrypted-data/
    # Static, because the parts are external links rather than posts and so
    # cannot be counted the way `posts_kind` counts them. The year is the year
    # of writing, which predates the Encrypted Systems Lab blog now hosting them.
    meta: 5 parts &nbsp;&middot;&nbsp; 2013 &nbsp;&middot;&nbsp; archival

# The parts of the How to Search on Encrypted Data series, listed on its own
# page. `short_title` is what the numbered list shows, so each entry reads as
# its part name rather than repeating the series title five times.
how_to_search:
  - title: "How to Search on Encrypted Data: Introduction"
    short_title: Introduction
    url: https://esl.cs.brown.edu/blog/how-to-search-on-encrypted-data-introduction-part-1/
    date: 2013-10-06

  - title: "How to Search on Encrypted Data: Deterministic Encryption"
    short_title: Deterministic Encryption
    url: https://esl.cs.brown.edu/blog/how-to-search-on-encrypted-data-deterministic-encryption-part-2/
    date: 2013-10-14

  - title: "How to Search on Encrypted Data: Functional Encryption"
    short_title: Functional Encryption
    url: https://esl.cs.brown.edu/blog/how-to-search-on-encrypted-data-functional-encryption-part-3/
    date: 2013-10-30

  - title: "How to Search on Encrypted Data: Oblivious RAM"
    short_title: Oblivious RAM
    url: https://esl.cs.brown.edu/blog/how-to-search-on-encrypted-data-oblivious-rams-part-4/
    date: 2013-12-20

  - title: "How to Search on Encrypted Data: Searchable Symmetric Encryption"
    short_title: Searchable Symmetric Encryption
    url: https://esl.cs.brown.edu/blog/how-to-search-on-encrypted-data-searchable-symmetric-encryption-part-5/
    date: 2014-08-21

