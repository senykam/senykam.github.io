# Fixed entries for the /writing/ page, keyed by the section they appear in.
#
# These live here rather than in _posts because they are finished and will not
# change, and because back-dated stubs would show up as new items in the feed.
# Living writing (notes, essays, new explainers) goes in _posts instead.
#
# Each entry takes: title, url, and optionally meta and links. They render
# through the same include as posts, so the formatting matches. Use `links` for
# the same piece published elsewhere, which sits inline on the byline. A
# description field is supported but only the notes display one.

